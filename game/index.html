<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA 6 Mini — Kota Top-Down</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="hud-item">Kecepatan: <span id="speed">0</span> km/jam</div>
    <div class="hud-item">Waktu: <span id="time">08:00</span></div>
    <div class="hud-item">Uang: $<span id="money">0</span></div>
    <div class="hud-item">Bintang: <span id="wanted">0</span></div>
  </header>
  <main id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <canvas id="minimap" width="200" height="200"></canvas>
  </main>
  <footer id="controls">
    <button id="start" type="button">Mulai Game</button>
    <span class="hint">WASD / panah: jalan &amp; nyetir &middot; Spasi: rem &middot; E: masuk mobil</span>
  </footer>
  <script src="systems.js"></script>
  <script src="game.js"></script>
</body>
</html>
