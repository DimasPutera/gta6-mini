<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA 6 Mini — Kota Top-Down</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>GTA 6 Mini — Kota Top-Down</h1>
    <div id="hud">
      <span>Kecepatan: <b id="speed">0</b> km/jam</span>
      <span>Waktu: <b id="time">00:00</b></span>
      <span>Uang: $<b id="money">0</b></span>
      <span>Bintang: <b id="wanted">0</b></span>
      <button id="start">Mulai</button>
    </div>
  </header>
  <main>
    <canvas id="game" width="1280" height="720"></canvas>
    <canvas id="minimap" width="200" height="200"></canvas>
  </main>
  <script src="systems.js"></script>
  <script src="game.js"></script>
</body>
</html>
