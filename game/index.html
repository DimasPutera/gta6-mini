<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 6 Mini — Kota Top-Down</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>GTA 6 Mini — Kota Top-Down</h1>
</header>
<main>
<section id="hud" aria-label="HUD">
<div>Kecepatan: <span id="speed">0</span></div>
<div>Waktu: <span id="time">00:00</span></div>
<div>Uang: <span id="money">$0</span></div>
<div>Wanted: <span id="wanted">0</span></div>
</section>
<canvas id="game" width="1280" height="720"></canvas>
<canvas id="minimap" width="200" height="200"></canvas>
<div id="controls">
<button id="start" type="button">Mulai</button>
</div>
</main>
<script src="systems.js"></script>
<script src="draw.js"></script>
<script src="game.js"></script>
</body>
</html>
